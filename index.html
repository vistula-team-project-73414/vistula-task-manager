<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
</head>
<body>

    <h1>Task Manager</h1>

    <p id="student-id">73414</p>

    <form id="task-form">
        <input
            type="text"
            id="task-title"
            placeholder="Task title"
            required
        >

        <input
            type="text"
            id="task-description"
            placeholder="Task description"
        >

        <button id="task-submit" type="submit">
            Save Task
        </button>
    </form>

    <div id="status-message"></div>

    <div id="task-list"></div>

    <p>
        <a id="contribution-link" href="contribution.html">
            Team Contribution
        </a>
    </p>

    <script src="app.js"></script>

</body>
</html>
